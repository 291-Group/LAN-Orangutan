<!DOCTYPE html>
<html lang="{{.Lang}}" dir="{{.Dir}}" data-theme="{{.Theme}}">
<head>
    <script>(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("accent")||"blue";if(a!=="orange")document.documentElement.setAttribute("data-accent",a);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t $.Lang "auth.welcome"}} - LAN Orangutan</title>
    <link rel="stylesheet" href="/static/style.css?v={{.Version}}">
    <link rel="icon" type="image/svg+xml" href="/static/orangutan.svg">
</head>
<body class="login-body">
    <main class="login-main">
        <div class="login-card">
            <div class="login-brand">
                <img src="/static/orangutan.svg" alt="" class="login-logo" width="72" height="72">
                <h1>LAN Orangutan</h1>
            </div>

            <p class="setup-welcome">{{t $.Lang "auth.welcome"}}</p>
            <p class="setup-intro">{{t $.Lang "auth.setupIntro"}}</p>

            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}

            <form method="POST" action="/setup" class="login-form">
                <div class="form-group">
                    <label for="password">{{t $.Lang "auth.password"}}</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input"
                        autocomplete="new-password"
                        minlength="{{.MinPasswordLength}}"
                        autofocus
                        required>
                    <p class="form-help">{{tn $.Lang "auth.minLength" .MinPasswordLength}}</p>
                </div>

                <div class="form-group">
                    <label for="confirm">{{t $.Lang "auth.confirmPassword"}}</label>
                    <input
                        type="password"
                        id="confirm"
                        name="confirm"
                        class="input"
                        autocomplete="new-password"
                        minlength="{{.MinPasswordLength}}"
                        required>
                </div>

                <button type="submit" class="btn btn-primary login-submit">{{t $.Lang "auth.getStarted"}}</button>
            </form>

            <p class="setup-note">{{t $.Lang "auth.setupNote"}}</p>
        </div>
        {{template "langpicker" (langPicker . true)}}
    </main>

    <script>
        // Apply the saved theme before anything is shown, matching the rest of
        // the app so the page does not flash the wrong colours.
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
    {{template "i18nscript" .}}
</body>
</html>
